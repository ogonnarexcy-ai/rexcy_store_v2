<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rexcy Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="center-page">

<div class="login-box">

    <h1>Admin Login</h1>

    <p>Welcome back to Rexcy Store.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p class="message {{ category }}">
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit" class="button full">
            Login
        </button>

    </form>

    <a href="/" class="back">
        ← Back to Store
    </a>

</div>

</body>

</html>
